<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Planner</title>
<style>
:root{
  --bg:#f3f6f8;--card:#fff;--text:#0f172a;--muted:#5b6b80;--line:#e5eaf0;
  --accent:#0f766e;--on-accent:#fff;--soft:#d9f2ee;--danger:#dc2626;--on-danger:#fff;--danger-soft:#fee2e2;
  --warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;--info:#1d4ed8;--info-soft:#dbeafe;
  --danger-fg:#b91c1c;--dot:#16a34a;--pill-shadow:0 10px 22px rgba(15,23,42,.16),0 3px 7px rgba(15,23,42,.10),inset 0 1px 0 rgba(255,255,255,.9);--pill-on-shadow:0 4px 10px rgba(15,23,42,.35);--hdr-bg:#0b5f58;--hdr-fg:#fff;--toast-bg:#0f172a;--toast-fg:#fff;--outline:#79868f;color-scheme:light;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05)}
:root[data-theme=dark]{--bg:#0b1220;--card:#131c2e;--text:#e6edf6;--muted:#9fb0c6;--line:#27354f;--accent:#2dd4bf;--on-accent:#04201c;--soft:#12332f;--danger:#f87171;--on-danger:#2a0a0a;--danger-soft:#3b1717;--warn:#fbbf24;--warn-soft:#3a2d0b;--ok:#4ade80;--ok-soft:#10301c;--info:#93c5fd;--info-soft:#16284a;--shadow:none;--danger-fg:#f87171;--dot:#3ddc97;--pill-shadow:0 12px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);--pill-on-shadow:0 4px 12px rgba(0,0,0,.55);--hdr-bg:#0e3b37;--hdr-fg:#e0fbf7;--toast-bg:#e6edf6;--toast-fg:#0b1220;--outline:#8a98ab;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c2e;--text:#e6edf6;--muted:#9fb0c6;--line:#27354f;--accent:#2dd4bf;--on-accent:#04201c;--soft:#12332f;--danger:#f87171;--on-danger:#2a0a0a;--danger-soft:#3b1717;--warn:#fbbf24;--warn-soft:#3a2d0b;--ok:#4ade80;--ok-soft:#10301c;--info:#93c5fd;--info-soft:#16284a;--shadow:none;--danger-fg:#f87171;--dot:#3ddc97;--pill-shadow:0 12px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);--pill-on-shadow:0 4px 12px rgba(0,0,0,.55);--hdr-bg:#0e3b37;--hdr-fg:#e0fbf7;--toast-bg:#e6edf6;--toast-fg:#0b1220;--outline:#8a98ab;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;min-height:72px}
header h1 .dot{color:var(--dot)}
header h1{flex:1;margin:0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.6px;color:var(--text)}
header button{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--text);width:50px;height:50px;border-radius:17px;font-size:22px;cursor:pointer;flex:0 0 auto}
header button.hide{display:none}
main{max-width:620px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom));touch-action:pan-y;overflow-x:hidden}
#view.anim-l{animation:pgL .32s cubic-bezier(.2,.8,.2,1)}#view.anim-r{animation:pgR .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pgL{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes pgR{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
#view.snap{transition:transform .22s ease}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:26px;margin:6px 14px 16px;padding:6px;box-shadow:var(--pill-shadow)}
#tabs::-webkit-scrollbar{display:none}
.tab{position:relative;overflow:hidden;flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:11px 18px;border-radius:21px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .28s,color .28s,transform .2s}
.tab:active{transform:scale(.96)}
.tab.on{background:var(--text);color:var(--bg);box-shadow:var(--pill-on-shadow)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
header #gear{margin-left:2px}header #gear.hide{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:13px}
h3{margin:0 0 12px;font-size:18px}
h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 0}
input,select,textarea{width:100%;margin-top:5px;padding:12px 12px;border-radius:8px;border:1px solid var(--outline);
  background:transparent;color:var(--text);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent)}
textarea{min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.btn,.menu button{position:relative;overflow:hidden}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.big{width:100%;padding:18px;font-size:19px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.btns.col{flex-direction:column}.btns .btn small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted);font-weight:600}
.menu{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:inherit;
  padding:15px 16px;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.menu button:first-child{border-top:0}
.menu .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.menu .go{margin-left:auto;color:var(--muted);font-size:20px}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.red i{background:var(--danger)}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;
  border-top:1px solid var(--line);padding:11px 0;color:inherit;font:inherit;cursor:pointer}
.row:first-child{border-top:0}
.row.off{padding:8px 0}.row.off .d{color:var(--muted);font-weight:600}
.row .d{font-weight:700;min-width:84px}
.row .r{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.row.today .d{color:var(--accent)}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.bad{background:var(--danger-soft);color:var(--danger-fg)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.info{background:var(--info-soft);color:var(--info)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.mute{background:var(--line);color:var(--text)}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.line.t{border-top:1px solid var(--line);margin-top:4px;padding-top:11px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.filters label{margin:0}
.filters.one{grid-template-columns:1fr}
#modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--toast-bg);color:var(--toast-fg);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.prev{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.sub h4{margin:0}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk label{margin:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text)}
.chk input{width:auto;margin:0}
/* Material-style dropdown (outlined field + elevated menu) */
.myear{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.myear b{font-size:20px}
.yb{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:24px;cursor:pointer;position:relative;overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mcell{position:relative;overflow:hidden;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:16px;padding:15px 0;font:inherit;font-weight:700;cursor:pointer}
.mcell.cur{border-color:var(--accent);color:var(--accent)}
.mcell.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ms{position:relative;margin-top:14px;text-align:left}
.filters .ms{margin-top:0}
.ms-l{position:absolute;left:12px;top:-8px;padding:0 4px;font-size:12px;font-weight:600;color:var(--muted);z-index:1;letter-spacing:.2px;pointer-events:none;transition:color .15s}
main .ms-l{background:var(--bg)}
#sheet .ms-l{background:var(--card)}
.ms-b{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:54px;padding:0 10px 0 16px;border:1px solid var(--outline);border-radius:8px;
  background:transparent;color:var(--text);font:inherit;font-size:16px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.ms-b:active{background:var(--soft)}
.ms-b.open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ms-b.open+.x,.ms:has(.ms-b.open) .ms-l{color:var(--accent)}
.ms-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-ar{flex:none;color:var(--muted);transition:transform .2s}
.ms-b.open .ms-ar{transform:rotate(180deg);color:var(--accent)}
#msmask{position:fixed;inset:0;z-index:40;background:transparent}
#msmenu{position:fixed;z-index:41;background:var(--card);border-radius:8px;padding:8px 0;overflow-y:auto;transform-origin:top center;
  box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);animation:msIn .14s ease-out}
@keyframes msIn{from{opacity:0;transform:scaleY(.92)}to{opacity:1;transform:none}}
#msmenu .mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:0 16px;border:0;background:none;color:var(--text);
  font:inherit;font-size:16px;text-align:left;cursor:pointer}
#msmenu .mi:active{background:var(--soft)}
#msmenu .mi.sel{background:var(--soft);color:var(--accent);font-weight:600}
.chk label:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chkline{display:flex;align-items:center;gap:10px;color:var(--text);font-size:15px;font-weight:600;margin:0 0 6px}
.chkline input{width:auto;margin:0}
/* Round checkboxes (native inputs and the log's selection circles) with a ripple on press */
input[type=checkbox],.cbx{-webkit-appearance:none;appearance:none;position:relative;flex:none;display:inline-block;width:22px;height:22px;margin:0;padding:0;
  border:2px solid var(--outline);border-radius:50%;background:transparent;cursor:pointer;vertical-align:middle;transition:background-color .18s,border-color .18s;
  --rc:rgba(15,118,110,.3)}
@supports (color:color-mix(in srgb,red 50%,blue)){input[type=checkbox],.cbx{--rc:color-mix(in srgb,var(--accent) 34%,transparent)}}
input[type=checkbox]::after,.cbx::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.2,.8,.3,1.5)}
input[type=checkbox]:checked,.cbx.on{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after,.cbx.on::after{transform:rotate(45deg) scale(1)}
input[type=checkbox]:focus{outline:none}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.crip::before{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;animation:crip .5s ease-out}
@keyframes crip{from{box-shadow:0 0 0 0 var(--rc)}to{box-shadow:0 0 0 18px transparent}}
/* Daily log multi-select */
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.selm{position:relative;overflow:hidden;justify-content:flex-start;margin:0 -16px;padding-left:16px;padding-right:16px;width:calc(100% + 32px);transition:background .18s}
.row.selm .r{margin-left:auto}
.row.selm .cbx{animation:cbIn .22s cubic-bezier(.2,.8,.2,1)}
.row.picked{background:var(--soft)}
@keyframes cbIn{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.brkbtn{background:var(--warn-soft);color:var(--warn)}
.brk.on{margin:12px 0 4px;padding:12px;border-radius:14px;background:var(--warn-soft);color:var(--warn)}
.brk.on .muted{color:inherit;opacity:.85}
.btimer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
/* Floating "+ Add" button, bottom right (same as the expenses app) */
.fab{position:fixed;right:max(18px,calc(50vw - 292px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:4;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);
  font:800 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 24px;min-height:58px;cursor:pointer;overflow:hidden;
  box-shadow:0 10px 22px rgba(15,23,42,.28),0 3px 7px rgba(15,23,42,.18);transition:transform .15s,box-shadow .15s;animation:fabIn .28s cubic-bezier(.2,.8,.2,1)}
.fab:active{transform:scale(.96);box-shadow:0 5px 12px rgba(15,23,42,.26),0 2px 4px rgba(15,23,42,.16)}
:root[data-theme=dark] .fab{box-shadow:0 10px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .fab{box-shadow:0 10px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.45)}}
@keyframes fabIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
body.fabon main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.selon main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -8px 24px rgba(15,23,42,.14);padding:10px 14px calc(14px + env(safe-area-inset-bottom));animation:sbUp .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sbUp{from{transform:translateY(100%)}to{transform:none}}
#selbar .in{max-width:620px;margin:0 auto}
.sb-top{display:flex;align-items:center;gap:10px}
.sb-x{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--text);font-size:20px;cursor:pointer}
.sb-n{flex:1;font-weight:800;font-size:17px}
.sb-all{display:flex;align-items:center;gap:10px;margin:0;padding:8px 4px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
#selbar .btns{margin-top:8px}

/* ===== Planner additions (same tokens as the house style) ===== */
[hidden]{display:none!important}
.note{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.card .note{margin:10px 0 0}
.note.bad{background:var(--danger-soft);color:var(--danger-fg)}.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}.note.info{background:var(--info-soft);color:var(--info)}
.tl{padding:6px 12px}
.tline{display:flex;align-items:center;border-top:1px solid var(--line)}.tline:first-child{border-top:0}
.chev{flex:0 0 26px;width:26px;height:44px;border:0;background:none;color:var(--muted);padding:0;display:grid;place-items:center;cursor:pointer}
.trow{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.trow .tx{flex:1;min-width:0}.trow .tx b{display:block;font-weight:600;overflow-wrap:anywhere}.trow.sum .tx b{font-weight:800}
.trow .tx small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wbs{color:var(--muted);font-weight:700;margin-right:6px;font-size:13px}
.pct{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.tico{width:34px;height:34px;flex:none;display:grid;place-items:center}
.ring{width:34px;height:34px;flex:none}.ring .rb{fill:none;stroke:var(--line);stroke-width:4}.ring .rf{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round}
.stat b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk .pc{position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.prow,.arow{display:grid;grid-template-columns:minmax(0,1fr) 82px 70px 36px;gap:8px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.arow{grid-template-columns:minmax(0,1fr) 92px 36px}
.prow .ms,.arow .ms{margin-top:14px}.lag{margin:0}.lag input{min-height:54px}
.xbtn{width:36px;height:54px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:14px}.split i{display:block;height:100%}
.gwrap{display:grid;grid-template-columns:var(--nw,128px) minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow)}
.gnames{border-right:1px solid var(--line)}
.gnames .gh{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 8px 6px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.gnames button{display:flex;align-items:center;width:100%;height:40px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:13px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:left;padding:0 6px;cursor:pointer;white-space:nowrap;overflow:hidden}
.gnames button span{overflow:hidden;text-overflow:ellipsis}.gnames button.s{font-weight:800}.gnames button.c{color:var(--danger-fg)}
.gscroll{overflow-x:auto;overscroll-behavior-x:contain}.gscroll svg{display:block}
.gt{fill:var(--muted);font:11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.gth{fill:var(--text);font:700 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.gl{stroke:var(--line);stroke-width:1}.gwe{fill:var(--bg)}
.gn{fill:var(--accent)}.gc{fill:var(--danger)}.gp{fill:rgba(0,0,0,.3)}.gs{fill:var(--text)}.gb{fill:var(--muted);opacity:.7}

<script>
/* ===== Planner scheduling engine (no DOM) ===== */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const x=pd(s);x.setDate(x.getDate()+n);return iso(x)};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=iso(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byOrd=(a,b)=>((+a.ord||0)-(+b.ord||0))||String(a.id).localeCompare(String(b.id));

function makeCal(p){
 let wk=new Set((p.wk||[5,6]).map(Number));if(wk.size>=7)wk=new Set();
 const hol=new Set(p.hol||[]),start=p.start||today;
 const isW=s=>!wk.has(pd(s).getDay())&&!hol.has(s);
 const days=[];let cur=start,guard=0;
 const ext=i=>{while(days.length<=i&&guard<40000){let g=0;while(!isW(cur)&&g++<400)cur=addDays(cur,1);days.push(cur);cur=addDays(cur,1);guard++}};
 const wd=i=>{i=Math.max(0,Math.floor(i));ext(i);return days[Math.min(i,days.length-1)]};
 const idx=s=>{if(!s||s<=start)return 0;ext(0);while(days[days.length-1]<s&&guard<40000)ext(days.length);
  let lo=0,hi=days.length-1;while(lo<hi){const m=(lo+hi)>>1;if(days[m]<s)lo=m+1;else hi=m}return days[lo]>=s?lo:days.length};
 return{wd,idx,isW,start};
}

/* Critical-path schedule with optional resource leveling.
   Index units are working days from the project start; a task occupies [es, ef). */
function schedule(p,tasks,res){
 const cal=makeCal(p),hpd=+p.hpd||8;
 const list=[...tasks].sort(byOrd);
 const info=new Map(),Rm=new Map((res||[]).map(r=>[r.id,r]));
 list.forEach((t,i)=>{const nx=list[i+1];info.set(t.id,{id:t.id,t,i,sum:!!(nx&&(nx.lvl||0)>(t.lvl||0)),kids:[],parent:null,succ:[],preds:[]})});
 const st=[],cnt=[];
 for(const t of list){const L=t.lvl||0;while(st.length&&(st.at(-1).lvl||0)>=L)st.pop();const par=st.at(-1),x=info.get(t.id);
  if(par){x.parent=par.id;info.get(par.id).kids.push(t.id)}st.push(t);
  cnt.length=L+1;cnt[L]=(cnt[L]||0)+1;x.wbs=Array.from(cnt,v=>v||1).join('.')}
 const leaves=list.map(t=>info.get(t.id)).filter(x=>!x.sum);
 for(const x of leaves){const t=x.t;x.ms=!!t.ms||!(+t.dur>0);x.dur=x.ms?0:Math.max(1,Math.round(+t.dur));
  x.preds=(t.preds||[]).filter(q=>q&&q.t!==t.id&&info.has(q.t)&&!info.get(q.t).sum);
  x.preds.forEach(q=>info.get(q.t).succ.push({id:t.id,ty:q.ty||'FS',lag:+q.lag||0}))}
 const predVal=(x,q)=>{const y=info.get(q.t),lag=+q.lag||0;switch(q.ty){case'SS':return y.es+lag;case'FF':return y.ef+lag-x.dur;case'SF':return y.es+lag-x.dur;default:return y.ef+lag}};
 const calc=(x,done)=>{
  if(x.t.mode==='manual'&&x.t.start){x.drv=false;return cal.idx(x.t.start)}
  let es=x.t.start?cal.idx(x.t.start):0,drv=false;
  for(const q of x.preds){if(done&&!done.has(q.t))continue;if(info.get(q.t).es==null)continue;const v=predVal(x,q);if(v>es){es=v;drv=true}else if(v===es&&v>0)drv=true}
  x.drv=drv;return Math.max(0,es)};
 let cycle=false,seq=[];
 const forward=lv=>{leaves.forEach(x=>{x.es=null;x.ef=null});const done=new Set(),use=new Map();let left=leaves.slice();seq=[];
  const fits=(x,es)=>{for(const a of x.t.asg||[]){const r=Rm.get(a.r);if(!r||(r.type||'work')!=='work')continue;const mx=+r.max||100,u=+a.u||0,m=use.get(r.id);if(!m)continue;
    for(let d=es;d<es+x.dur;d++){const c=m.get(d)||0;if(c>0&&c+u>mx+1e-9)return false}}return true};
  while(left.length){let ready=left.filter(x=>x.preds.every(q=>done.has(q.t)));if(!ready.length){cycle=true;ready=[left[0]]}
   for(const x of ready)x.cand=calc(x,done);
   ready.sort((a,b)=>a.cand-b.cand||((a.slack0??0)-(b.slack0??0))||a.i-b.i);
   const x=ready[0];let es=x.cand;
   if(lv&&x.t.mode!=='manual'&&x.dur>0){let n=0;while(!fits(x,es)&&n++<2000)es++}
   x.lvd=es-x.cand;x.es=es;x.ef=es+x.dur;
   for(const a of x.t.asg||[]){const r=Rm.get(a.r);if(!r||(r.type||'work')!=='work')continue;if(!use.has(r.id))use.set(r.id,new Map());
    const m=use.get(r.id);for(let d=es;d<x.ef;d++)m.set(d,(m.get(d)||0)+(+a.u||0))}
   done.add(x.id);left.splice(left.indexOf(x),1);seq.push(x)}
  return use};
 let PF=0;
 const backward=()=>{PF=leaves.length?Math.max(...leaves.map(x=>x.ef)):0;leaves.forEach(x=>{x.ls=x.lf=null});
  for(const x of [...seq].reverse()){let lf=PF;
   for(const s of x.succ){const y=info.get(s.id);if(y.ls==null)continue;let v;
    switch(s.ty){case'SS':v=y.ls-s.lag+x.dur;break;case'FF':v=y.lf-s.lag;break;case'SF':v=y.lf-s.lag+x.dur;break;default:v=y.ls-s.lag}lf=Math.min(lf,v)}
   x.lf=lf;x.ls=lf-x.dur;x.slack=x.ls-x.es;x.crit=x.slack<=0}};
 let use=forward(false);backward();leaves.forEach(x=>{x.slack0=x.slack;x.es0=x.es});
 if(p.level){use=forward(true);backward()}
 for(const x of leaves){const t=x.t;
  if(x.ms){const d=x.drv&&x.es>0?cal.wd(x.es-1):cal.wd(x.es);x.sd=x.fd=d;x.gs=x.ge=x.drv&&x.es>0?addDays(d,1):d}
  else{x.sd=cal.wd(x.es);x.fd=cal.wd(x.ef-1);x.gs=x.sd;x.ge=addDays(x.fd,1)}
  let cost=+t.fc||0,work=0;x.rc=[];
  for(const a of t.asg||[]){const r=Rm.get(a.r);if(!r)continue;const ty=r.type||'work',u=+a.u||0;let c=0,h=0;
   if(ty==='material')c=u*(+r.rate||0);else if(ty==='cost')c=u;else{h=x.dur*hpd*u/100;c=h*(+r.rate||0)}
   cost+=c;work+=h;x.rc.push({r:r.id,c,h,u})}
  x.cost=cost;x.work=work;x.pct=Math.max(0,Math.min(100,+t.pct||0));x.ac=cost*x.pct/100}
 const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
 for(const t of [...list].reverse()){const x=info.get(t.id);if(!x.sum)continue;const ks=x.kids.map(k=>info.get(k));
  x.es=Math.min(...ks.map(k=>k.es));x.ef=Math.max(...ks.map(k=>k.ef));x.dur=x.ef-x.es;
  x.gs=ks.map(k=>k.gs).sort()[0];x.ge=ks.map(k=>k.ge).sort().at(-1);x.sd=ks.map(k=>k.sd).sort()[0];x.fd=ks.map(k=>k.fd).sort().at(-1);
  x.cost=sum(ks,'cost')+(+t.fc||0);x.work=sum(ks,'work');x.ac=sum(ks,'ac')+(+t.fc||0)*0;
  const w=ks.reduce((s,k)=>s+k.dur,0);x.pct=w?ks.reduce((s,k)=>s+k.pct*k.dur,0)/w:ks.reduce((s,k)=>s+k.pct,0)/ks.length;
  x.ac=sum(ks,'ac')+(+t.fc||0)*x.pct/100;
  x.crit=ks.some(k=>k.crit);x.slack=Math.min(...ks.map(k=>k.slack));x.ms=false;x.rc=[];x.lvd=0;x.over=ks.some(k=>k.over)}
 const el=cal.idx(today);
 /* over-allocation */
 const over=new Map();
 for(const[rid,m]of use){const r=Rm.get(rid),mx=+r.max||100;const days=[...m].filter(([,u])=>u>mx+1e-9).map(([d])=>d);over.set(rid,{days:new Set(days),peak:Math.max(0,...m.values())})}
 for(const x of leaves){x.over=(x.t.asg||[]).some(a=>{const o=over.get(a.r);if(!o||!o.days.size)return false;for(let d=x.es;d<x.ef;d++)if(o.days.has(d))return true;return false})}
 for(const t of [...list].reverse()){const x=info.get(t.id);if(x.sum)x.over=x.kids.some(k=>info.get(k).over)}
 /* status & baseline */
 for(const x of info.values()){
  const exp=x.dur>0?Math.max(0,Math.min(1,(el-x.es)/x.dur))*100:(el>x.es?100:0);x.exp=exp;
  x.status=x.pct>=100?'done':(exp>=100)?'late':(x.pct+10<exp)?'behind':x.pct>0?'progress':'not';
  const bl=x.t.bl;if(bl&&bl.f){x.vf=cal.idx(x.fd)-cal.idx(bl.f);x.vs=cal.idx(x.sd)-cal.idx(bl.s);x.vc=x.cost-(+bl.c||0)}
  x.dlMiss=!!(x.t.dl&&x.fd>x.t.dl)}
 const roots=list.map(t=>info.get(t.id)).filter(x=>!x.parent);
 const tot={start:roots.length?roots.map(x=>x.sd).sort()[0]:cal.wd(0),finish:roots.length?roots.map(x=>x.fd).sort().at(-1):cal.wd(0),
  cost:sum(roots,'cost'),ac:sum(roots,'ac'),work:sum(roots,'work')};
 tot.dur=PF;const rw=roots.reduce((s,x)=>s+x.dur,0);tot.pct=roots.length?(rw?roots.reduce((s,x)=>s+x.pct*x.dur,0)/rw:sum(roots,'pct')/roots.length):0;
 let pv=0,ev=0,blc=0,hasBl=false;
 for(const x of leaves){const bl=x.t.bl;if(!bl||!bl.f)continue;hasBl=true;const c=+bl.c||0,bs=cal.idx(bl.s),bd=+bl.d||0;blc+=c;ev+=c*x.pct/100;
  pv+=c*(bd>0?Math.max(0,Math.min(1,(el-bs)/bd)):(el>bs?1:0))}
 tot.bl=hasBl?{c:blc,pv,ev,ac:tot.ac,spi:pv?ev/pv:null,cpi:tot.ac?ev/tot.ac:null,f:p.blF||null}:null;
 if(tot.bl&&tot.bl.f)tot.vf=cal.idx(tot.finish)-cal.idx(tot.bl.f);
 return{cal,list,info,leaves,PF,el,cycle,over,use,tot,hpd};
}

/* ===== Templates ===== */
function templateBus(){
 const R={de:{name:'Design engineer',type:'work',rate:250,max:100,grp:'R&D'},pe:{name:'Process engineer',type:'work',rate:220,max:100,grp:'Manufacturing engineering'},
  qe:{name:'Quality engineer',type:'work',rate:200,max:100,grp:'Quality'},pu:{name:'Purchasing specialist',type:'work',rate:180,max:100,grp:'Supply chain'},
  pt:{name:'Production team',type:'work',rate:150,max:400,grp:'Production'},st:{name:'Steel sheet 3 mm',type:'material',rate:1200,unit:'sheets',grp:'Materials'},
  tl:{name:'Tooling budget',type:'cost',grp:'Budget'}};
 const res={};for(const k in R)res[k]={id:uid(),...R[k]};
 // [lvl, name, dur, milestone, preds (row numbers), [[res,units]], fixed cost]
 const rows=[
  [0,'Engineering change: rear frame reinforcement'],
  [1,'Change request review',2,0,[],[['de',100],['qe',50]]],
  [1,'3D design & drawings',8,0,[1],[['de',100]]],
  [1,'Design review approved',0,1,[2]],
  [1,'BOM & routing update',2,0,[3],[['de',100],['pe',50]]],
  [0,'Procurement'],
  [1,'RFQ to suppliers',3,0,[4],[['pu',100]]],
  [1,'Supplier selection & PO',2,0,[6],[['pu',100]]],
  [1,'Material delivery (lead time)',15,0,[7],[['st',40]]],
  [0,'Tooling & process'],
  [1,'Welding fixture design',6,0,[3],[['pe',100]]],
  [1,'Fixture manufacturing',10,0,[10],[['tl',85000]]],
  [1,'Work instructions & process sheets',4,0,[10],[['pe',100]]],
  [0,'Trial build'],
  [1,'Pilot bus build',5,0,[8,11,12],[['pt',200],['pe',50]]],
  [1,'Quality inspection & PPAP',3,0,[14],[['qe',100]]],
  [1,'Trial build approved',0,1,[15]],
  [0,'Start of serial production',0,1,[16]]];
 const ids=rows.map(()=>uid());
 const tasks=rows.map((r,i)=>({id:ids[i],ord:(i+1)*10,lvl:r[0],name:r[1],dur:r[2]||1,ms:!!r[3],mode:'auto',pct:0,
  preds:(r[4]||[]).map(n=>({t:ids[n],ty:'FS',lag:0})),asg:(r[5]||[]).map(([k,u])=>({r:res[k].id,u})),fc:r[6]||0,notes:''}));
 return{tasks,res:Object.values(res)};
}

<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=o=>JSON.parse(JSON.stringify(o));
const fmt=d=>{if(!d)return '—';const x=pd(d);return x.getDate()+' '+MON[x.getMonth()]+' '+x.getFullYear()};
const fmtS=d=>{if(!d)return '—';const x=pd(d);return x.getDate()+' '+MON[x.getMonth()]};
const dayLong=s=>pd(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const dd=n=>plural(Math.round(n*10)/10,'day');
const ago=t=>{if(!t)return '';const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
const errMsg=e=>(e&&(e.message||e.code))||String(e||'error');

/* ================= data ================= */
const KEY='planner.v1';
let mem=null;
function defaults(){return{projects:{},tasks:{},res:{},settings:{theme:'auto',cur:'',remind:true,remindAt:'08:00',cuToken:''}}}
function load(){const d=defaults();let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){raw=mem}
 if(raw){try{const p=JSON.parse(raw);['projects','tasks','res'].forEach(k=>{if(p[k]&&typeof p[k]==='object')d[k]=p[k]});
  if(p.settings)Object.keys(d.settings).forEach(k=>{if(p.settings[k]!==undefined)d.settings[k]=p.settings[k]})}catch(e){}}
 return d}
let D=load(),ver=0,cache=null;
function save(){ver++;const s=JSON.stringify(D);try{localStorage.setItem(KEY,s)}catch(e){mem=s}syncNative()}
const projList=()=>Object.values(D.projects).sort((a,b)=>(b.upd||0)-(a.upd||0));
function curP(){let p=D.projects[D.settings.cur];if(!p){p=projList()[0]||null;if(p)D.settings.cur=p.id}return p}
const TT=()=>{const p=curP();return p?Object.values(D.tasks[p.id]||{}):[]};
const RR=()=>{const p=curP();return p?Object.values(D.res[p.id]||{}):[]};
function SC(){const p=curP();if(!p)return null;if(!cache||cache.ver!==ver||cache.pid!==p.id||cache.day!==today)cache={ver,pid:p.id,day:today,S:schedule(p,TT(),RR())};return cache.S}
function putTask(t,pid){pid=pid||curP().id;t={...t,upd:Date.now()};(D.tasks[pid]=D.tasks[pid]||{})[t.id]=clean(t);touch(pid);save()}
function delTaskD(id){const p=curP();if(D.tasks[p.id])delete D.tasks[p.id][id];touch(p.id);save()}
function putRes(r,pid){pid=pid||curP().id;(D.res[pid]=D.res[pid]||{})[r.id]=clean(r);touch(pid);save()}
function delResD(id){const p=curP();if(D.res[p.id])delete D.res[p.id][id];touch(p.id);save()}
function putProj(p){D.projects[p.id]={...clean(p),upd:Date.now()};save()}
function touch(pid){if(D.projects[pid])D.projects[pid].upd=Date.now()}
const cur=()=>{const p=curP();return(p&&p.cur)||'EGP'};
const money=n=>Math.round(n||0).toLocaleString('en-US')+' '+cur();
const kmoney=n=>{n=Math.round(n||0);const a=Math.abs(n);return(a>=1e6?(n/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e4?Math.round(n/1e3)+'k':n.toLocaleString('en-US'))+' '+cur()};
const signed=(n,u)=>n>0?'+'+n+' '+u:n<0?'−'+(-n)+' '+u:'on '+(u==='days'?'schedule':'budget');
const STN={done:'Done',late:'Late',behind:'Behind',progress:'In progress',not:'Not started'};
const STT={done:'ok',late:'bad',behind:'warn',progress:'info',not:'mute'};
const STC={done:'var(--ok)',late:'var(--danger)',behind:'var(--warn)',progress:'var(--accent)',not:'var(--muted)'};

/* ================= UI state ================= */
let view='home',prevView='home',draft=null,isNew=false,rdraft=null,rNew=false,gScroll=null,resolver=null,syncing=false,cuLog=[],drive=null;
const ui={filter:'all',zoom:'week',crit:true,base:true,links:true,nwk:'5,6',ntpl:'blank'};
const collapsed=new Set();
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(h){closeMs();$('#sheet').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){closeMs();$('#modal').classList.remove('show');$('#sheet').innerHTML='';if(resolver){const r=resolver;resolver=null;r(false)}}
function ask(msg,ok,sub){return new Promise(res=>{openModal('<h3>'+esc(msg)+'</h3>'+(sub?'<div class="muted small" style="margin-top:-4px">'+esc(sub)+'</div>':'')+'<div class="btns"><button class="btn ghost" data-a="ask-no">Cancel</button><button class="btn danger" data-a="ask-yes">'+esc(ok||'Confirm')+'</button></div>');resolver=res})}
const TABS=[['home','Home'],['tasks','Tasks'],['gantt','Gantt'],['res','Resources'],['reports','Reports'],['project','Project']];
const tabIdx=v=>TABS.findIndex(t=>t[0]===v);
const TITLES={settings:'Settings',task:'Task',resed:'Resource',newproj:'New project'};
function buildTabs(){$('#tabs').innerHTML=TABS.map(t=>'<button class="tab" data-tab="'+t[0]+'" data-go="'+t[0]+'">'+t[1]+'</button>').join('')}
function switchTab(v,dir){
 if(v===view)return;const from=tabIdx(view),to=tabIdx(v),d=dir||(from<0||to>from?1:-1);

let httpSeq=0;const httpWait={};

 return fetch(url,{method,headers,body:body==null?undefined:body}).then(async r=>({code:r.status,text:await r.text()}),e=>({code:0,text:String(e)}))}
async function cu(method,path,obj){const tok=(D.settings.cuToken||'').trim();if(!tok)throw new Error('Add your ClickUp token in Settings first.');
 const r=await http(method,'https://api.clickup.com/api/v2'+path,{'Authorization':tok,'Content-Type':'application/json'},obj?JSON.stringify(obj):null);
 let j=null;try{j=r.text?JSON.parse(r.text):{}}catch(e){}
 if(r.code<200||r.code>=300)throw new Error(r.code===0?'No connection to ClickUp. Check your internet.':r.code===401?'Your ClickUp token was not accepted.':((j&&(j.err||j.error))||'ClickUp error '+r.code));
 return j||{}}

    (x.preds&&x.preds.length?'\n\n**Predecessors:** '+x.preds.map(q=>{const y=S.info.get(q.t);return y.wbs+' '+y.t.name+' ('+(q.ty||'FS')+(+q.lag?' '+(q.lag>0?'+':'')+q.lag+'d':'')+')'}).join(', '):'')+

function planItems(){if(!D.settings.remind)return[];const items=[],now=Date.now(),[hh,mm]=(D.settings.remindAt||'08:00').split(':').map(Number),lim=addDays(today,30),days={};
 for(const p of Object.values(D.projects)){let S;try{S=schedule(p,Object.values(D.tasks[p.id]||{}),Object.values(D.res[p.id]||{}))}catch(e){continue}
  for(const x of S.leaves){if(x.pct>=100)continue;
   if(!x.ms&&x.sd>=today&&x.sd<=lim)(days[x.sd]=days[x.sd]||{s:[],d:[]}).s.push(x.t.name);
   if(x.fd>=today&&x.fd<=lim)(days[x.fd]=days[x.fd]||{s:[],d:[]}).d.push((x.ms?'◆ ':'')+x.t.name)}}
 for(const d of Object.keys(days).sort()){const t=pd(d);t.setHours(hh||0,mm||0,0,0);if(t.getTime()<=now)continue;const o=days[d];
  items.push({t:t.getTime(),id:'pl-'+d,k:'remind',title:'Planner · today',text:[o.s.length?'Starts: '+o.s.slice(0,6).join(', '):'',o.d.length?'Due: '+o.d.slice(0,6).join(', '):''].filter(Boolean).join('\n')})}

 if(view==='settings')render()};
async function restoreData(text){let d;try{d=JSON.parse(text)}catch(e){toast('That file is not a Planner backup');return}
 if(d&&d.app==='planner'&&d.data&&d.data.projects){if(!await ask('Replace everything on this phone with this backup?','Restore'))return;const keep=D.settings.cuToken;D={...defaults(),...d.data};D.settings={...defaults().settings,...(d.data.settings||{})};if(!D.settings.cuToken)D.settings.cuToken=keep;save();toast('Restored');render();return}
 if(d&&d.app==='planner'&&d.project&&Array.isArray(d.tasks)){const id=uid(),p={...d.project,id,name:d.project.name+(D.projects[d.project.id]?' (copy)':''),cu:null};D.projects[id]=p;D.tasks[id]={};D.res[id]={};
  d.tasks.forEach(t=>D.tasks[id][t.id]={...t,cu:null,cuSig:null,cuDeps:null});(d.resources||[]).forEach(r=>D.res[id][r.id]=r);D.settings.cur=id;save();toast('Imported '+p.name);render();return}
 toast('That file is not a Planner backup')}

/* ================= events ================= */
async function act(a,el){const p=curP(),d=el.dataset;
 switch(a){
  case 'msopen':openMs(el.closest('.ms'));break;
  case 'mspick':{const box=msBox,v=d.v;closeMs();if(box){box.dataset.cur=v;applySelect(box.dataset.ms,v,box)}break}
  case 'close':case 'ask-no':closeModal();break;
  case 'ask-yes':{const r=resolver;resolver=null;closeModal();if(r)r(true);break}
  case 'newproj':go('newproj');break;
  case 'tplbus':createProject(true);break;
  case 'create':createProject(false);break;
  case 'pick':D.settings.cur=d.id;collapsed.clear();cuLog=[];gScroll=null;save();render();toast('Opened '+D.projects[d.id].name);break;
  case 'col':collapsed.has(d.id)?collapsed.delete(d.id):collapsed.add(d.id);render();break;
  case 'redit':openRes(d.id);break;
  case 'rsave':{const n=(rdraft.name||'').trim();if(!n){toast('Give the resource a name');return}rdraft.name=n;rdraft.max=Math.max(1,+rdraft.max||100);rdraft.rate=+rdraft.rate||0;putRes(rdraft);toast(rNew?'Resource added':'Saved');rdraft=null;back();break}
  case 'rdel':if(await ask('Delete '+rdraft.name+'?','Delete','It is removed from every task it is assigned to.')){delResD(rdraft.id);rdraft=null;toast('Deleted');back()}break;
  case 'tsave':saveTask(false);break;
  case 'tdel':delTask();break;
  case 'pc':draft.pct=+d.v;$('[data-e=pct]').value=draft.pct;preview();break;
  case 'padd':{const used=new Set(draft.preds.map(q=>q.t)),o=predOptions().filter(x=>!used.has(x[0]));if(!o.length){toast('No other tasks to link to');return}
   const S=SC(),mi=(S.info.get(draft.id)||{i:1e9}).i,before=o.filter(x=>S.info.get(x[0]).i<mi);draft.preds.push({t:(before.at(-1)||o[0])[0],ty:'FS',lag:0});renderPA();preview();break}
  case 'prm':draft.preds.splice(+d.i,1);renderPA();preview();break;
  case 'aadd':{const R=RR();if(!R.length){toast('Add resources in the Resources tab first');return}const used=new Set(draft.asg.map(x=>x.r)),r=R.find(x=>!used.has(x.id));if(!r){toast('Everyone is already assigned');return}
   draft.asg.push({r:r.id,u:(r.type||'work')==='work'?100:r.type==='material'?1:0});renderPA();preview();break}
  case 'arm':draft.asg.splice(+d.i,1);renderPA();preview();break;
  case 'ol':if(!isNew)outline(d.v);break;
  case 'addrel':{const base=draft.id;if(saveTask(true))newTask({after:base,sub:d.v==='sub'});break}
  case 'holadd':{const v=$('#holD').value;if(!v){toast('Pick a date');return}const h=new Set(p.hol||[]);h.add(v);p.hol=[...h].sort();save();render();toast('Holiday added');break}
  case 'holdel':p.hol=(p.hol||[]).filter(x=>x!==d.d);save();render();break;
  case 'blset':setBaseline();break;
  case 'blclear':if(await ask('Clear the baseline?','Clear')){Object.values(D.tasks[p.id]||{}).forEach(t=>delete t.bl);p.blAt=null;p.blF=null;p.blC=null;save();render()}break;
  case 'csv':saveText('planner-'+safeName(p.name)+'-tasks.csv',csvTasks());break;
  case 'pexport':saveText('planner-'+safeName(p.name)+'.json',JSON.stringify({app:'planner',version:1,exported:new Date().toISOString(),project:p,tasks:TT(),resources:RR()},null,1));break;
  case 'pdel':if(await ask('Delete “'+p.name+'”?','Delete','All its tasks and resources are removed from this phone. ClickUp tasks stay in ClickUp.')){delete D.projects[p.id];delete D.tasks[p.id];delete D.res[p.id];D.settings.cur='';save();toast('Project deleted');switchTab('home');render()}break;
  case 'cupick':cuPick();break;
  case 'culink':cuLink(d.id);break;
  case 'cupaste':{const v=($('#cuPaste').value||'').trim(),m=v.match(/\/li\/(\d+)/)||v.match(/(\d{4,})\D*$/);if(!m){toast('Paste a list link or its number');return}cuLink(m[1]);break}
  case 'cupush':cuPush();break;case 'cupull':cuPull();break;
  case 'cuunlink':if(await ask('Unlink the ClickUp list?','Unlink','Tasks stay in ClickUp; Planner stops syncing them.')){p.cu=null;cuLog=[];save();render()}break;
  case 'cutest':try{const t=(await cu('GET','/team')).teams||[];toast('Connected to '+(t.map(x=>x.name).join(', ')||'ClickUp'))}catch(e){toast(errMsg(e))}break;
  case 'testnotif':if(hasNative()){Android.setPlan(JSON.stringify([{t:Date.now()+3000,id:'test',k:'remind',title:'Planner',text:'Notifications are working.'}].concat(planItems())));toast('Test notification in 3 seconds')}break;
  case 'dconnect':Android.driveConnect();break;case 'dbackup':syncNative();setTimeout(()=>Android.driveBackupNow(),700);break;
  case 'drestore':Android.driveRestore();break;case 'ddisc':Android.driveDisconnect();break;
  case 'backup':saveText('planner-backup-'+today+'.json',JSON.stringify({app:'planner',version:1,exported:new Date().toISOString(),data:{...D,settings:{...D.settings,cuToken:''}}},null,1));break;
  case 'restore':$('#restoreFile').click();break;
  case 'wipe':if(await ask('Erase all projects on this phone?','Erase all','This cannot be undone. Back up first if you may need them.')){const s=D.settings;D=defaults();D.settings={...s,cur:''};save();switchTab('home');render();toast('Erased')}break;
 }}
function applySelect(id,v){
 if(id==='theme'){D.settings.theme=v;applyTheme();save();render();return}
 if(id==='filter'){ui.filter=v;render();return}
 if(id==='zoom'){ui.zoom=v;gScroll=null;render();return}
 if(id==='nwk'){ui.nwk=v;return}if(id==='ntpl'){ui.ntpl=v;return}
 if(id==='r-type'&&rdraft){rdraft.type=v;render();return}
 if(!draft)return;
 if(id==='e-type'){draft.ms=v==='ms';if(!draft.ms){if(!(+draft.dur>0))draft.dur=1;const e=$('[data-e=dur]');if(e)e.value=draft.dur}preview();return}
 if(id==='e-mode'){draft.mode=v;preview();return}
 if(id==='e-pri'){draft.pri=v;return}
 const [k,i]=id.split('-');
 if(k==='pt'&&draft.preds[+i]){draft.preds[+i].t=v;renderPA();preview()}
 else if(k==='py'&&draft.preds[+i]){draft.preds[+i].ty=v;preview()}
 else if(k==='ar'&&draft.asg[+i]){draft.asg[+i].r=v;const r=RR().find(x=>x.id===v);if(r&&(r.type||'work')!=='work'&&draft.asg[+i].u===100)draft.asg[+i].u=1;renderPA();preview()}}
document.addEventListener('click',ev=>{
 const g=ev.target.closest('[data-go]');if(g){ev.preventDefault();go(g.dataset.go);return}
 const e=ev.target.closest('[data-edit]');if(e&&view!=='task'){editTask(e.dataset.edit);return}
 const b=ev.target.closest('[data-a]');if(b){act(b.dataset.a,b);return}
 if(ev.target.id==='modal')closeModal()});
$('#back').addEventListener('click',back);
$('#fab').addEventListener('click',()=>{if(view==='res')openRes(null);else if(curP())newTask()});
let pv=null;
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
 if(d.e&&draft){const v=t.value;switch(d.e){case'name':draft.name=v;break;case'dur':draft.dur=v===''?'':Math.max(1,parseInt(v)||1);break;case'start':draft.start=v||null;break;case'dl':draft.dl=v||null;break;
   case'pct':draft.pct=+v;break;case'fc':draft.fc=+v||0;break;case'notes':draft.notes=v;break}if(d.e!=='notes'&&d.e!=='name'){clearTimeout(pv);pv=setTimeout(preview,d.e==='pct'?0:250)}return}
 if(d.pi!=null&&draft){const q=draft.preds[+d.pi];if(q){q.lag=parseInt(t.value)||0;clearTimeout(pv);pv=setTimeout(preview,300)}return}
 if(d.ai!=null&&draft){const a=draft.asg[+d.ai];if(a){a.u=+t.value||0;clearTimeout(pv);pv=setTimeout(preview,300)}return}
 if(d.r&&rdraft){rdraft[d.r]=t.value;return}
});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset,p=curP();
 if(d.p&&p){let v=t.value.trim();if(d.p==='name'&&!v){toast('The project needs a name');t.value=p.name;return}if(d.p==='hpd')v=Math.min(24,Math.max(1,+v||8));if(d.p==='cur')v=(v||'EGP').toUpperCase();if(d.p==='start'&&!v)return;p[d.p]=v;save();toast('Saved');return}
 if(d.wd!=null&&p){const wk=new Set(p.wk||[5,6]),i=+d.wd;t.checked?wk.delete(i):wk.add(i);if(wk.size>=7){t.checked=true;toast('Keep at least one working day');return}p.wk=[...wk].sort();save();return}
 if(d.flag==='level'&&p){p.level=t.checked;save();toast(t.checked?'Leveling on':'Leveling off');return}
 if(d.g){ui[d.g]=t.checked;const ge=$('#gOut');if(ge){const sc=$('.gscroll');if(sc)gScroll=sc.scrollLeft;ge.innerHTML=gantt();afterGantt()}return}
 if(d.s){D.settings[d.s]=t.value.trim();save();toast('Saved');return}
 if(d.sflag){D.settings[d.sflag]=t.checked;save();return}
});
$('#restoreFile').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(f)restoreData(await f.text())});

/* ================= appearance ================= */
const darkMQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
const deviceDark=()=>{try{if(window.Android&&Android.isDark)return !!Android.isDark()}catch(e){}return !!(darkMQ&&darkMQ.matches)};
function applyTheme(){const t=D.settings.theme,root=document.documentElement,dark=t==='dark'||(t!=='light'&&deviceDark());
 root.setAttribute('data-theme',dark?'dark':'light');const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#0b1220':'#f3f6f8');
 try{if(window.Android&&Android.setBars)Android.setBars(dark?'#0b1220':'#f3f6f8',!dark)}catch(e){}}
window.onDeviceTheme=applyTheme;
document.addEventListener('visibilitychange',()=>{if(!document.hidden){applyTheme();if(['home','tasks','reports'].includes(view))render()}});
window.addEventListener('focus',applyTheme);if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',applyTheme);

buildTabs();
/* ---- ripple on taps ---- */
document.addEventListener('pointerdown',ev=>{const b=ev.target.closest('.tab,.btn,.menu button,header button,.fab,.pc');if(!b||b.disabled)return;
 const r=b.getBoundingClientRect(),sz=Math.max(r.width,r.height)*2.2,x=ev.clientX-r.left-sz/2,y=ev.clientY-r.top-sz/2;
 const e=document.createElement('span');e.className='rip';e.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+x+'px;top:'+y+'px';b.appendChild(e);setTimeout(()=>e.remove(),650)},{passive:true});
/* ---- swipe the screen left/right to move between tabs ---- */
(function(){let sx=0,sy=0,mode=0,on=false;const el=()=>$('#view');
 const blocked=t=>$('#modal').classList.contains('show')||$('#msmenu')||t.closest('input,textarea,select,.ms,#top,.fab,.gscroll,.scroll');
 document.addEventListener('touchstart',ev=>{on=false;mode=0;if(ev.touches.length!==1||tabIdx(view)<0||blocked(ev.target))return;sx=ev.touches[0].clientX;sy=ev.touches[0].clientY;on=true;el().classList.remove('snap')},{passive:true});
 document.addEventListener('touchmove',ev=>{if(!on)return;const dx=ev.touches[0].clientX-sx,dy=ev.touches[0].clientY-sy;
  if(!mode){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4)mode=1;else if(Math.abs(dy)>12){on=false;return}}
  if(mode){const i=tabIdx(view),edge=(dx>0&&i===0)||(dx<0&&i===TABS.length-1);el().style.transform='translateX('+(dx*(edge?.12:.35))+'px)'}},{passive:true});
 document.addEventListener('touchend',ev=>{if(!on||!mode){on=false;return}on=false;const dx=ev.changedTouches[0].clientX-sx,i=tabIdx(view),e=el(),nxt=dx<0?i+1:i-1;
  if(Math.abs(dx)>70&&nxt>=0&&nxt<TABS.length){e.style.transform='';switchTab(TABS[nxt][0],dx<0?1:-1)}else{e.classList.add('snap');e.style.transform='';setTimeout(()=>e.classList.remove('snap'),260)}},{passive:true});
 document.addEventListener('touchcancel',()=>{on=false;el().style.transform=''},{passive:true})})();
applyTheme();
try{if(hasNative()&&Android.driveStatus)drive=JSON.parse(Android.driveStatus())}catch(e){}
curP();render();syncNative();
setInterval(()=>{if(view==='home'||view==='tasks')updSummary()},5000);updSummary();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__app={get:()=>D,schedule:SC};
})();
